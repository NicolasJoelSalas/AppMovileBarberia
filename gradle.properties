# Project-wide Gradle settings.
# More info: https://docs.gradle.org/current/userguide/build_environment.html

# Memoria del daemon. Con ~10 módulos, 2 GB se queda corto al compilar Kotlin + Compose.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Un proyecto modular se beneficia de compilar módulos independientes en paralelo...
org.gradle.parallel=true
# ...y de reutilizar resultados de tareas ya ejecutadas (build cache).
org.gradle.caching=true
# Salta la fase de configuración si nada cambió en los scripts de build.
org.gradle.configuration-cache=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
